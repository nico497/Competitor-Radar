name: Competitor Radar

on:
  schedule:
    # Mondays 06:17 UTC. Change to suit your timezone: https://crontab.guru
    - cron: "17 6 * * 1"
  workflow_dispatch:      # adds a "Run workflow" button in the Actions tab
    inputs:
      mode:
        description: "run = normal scan. reanalyse = rewrite the analysis from saved data (one AI call)."
        type: choice
        options: [run, reanalyse]
        default: run
      classify_limit:
        description: "Catch-up: classify up to this many pages in one run (blank = normal caps)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: competitor-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check setup
        if: env.ANTHROPIC_API_KEY == ''
        run: |
          echo "No ANTHROPIC_API_KEY secret yet, so skipping this run. See README > Setup." | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: env.ANTHROPIC_API_KEY != ''

      - uses: actions/setup-python@v5
        if: env.ANTHROPIC_API_KEY != ''
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: env.ANTHROPIC_API_KEY != ''

      - name: Find and classify new pages
        if: env.ANTHROPIC_API_KEY != ''
        env:
          RADAR_CLASSIFY_LIMIT: ${{ inputs.classify_limit }}
        run: python radar.py ${{ inputs.mode == 'reanalyse' && '--reanalyse' || '' }}

      - name: Save results
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          git config user.name  "competitor-radar[bot]"
          git config user.email "competitor-radar@users.noreply.github.com"
          git add docs/data.json state/
          git diff --staged --quiet || git commit -m "Radar update $(date -u +%F)"
          git push
